<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사내 주차 예약 시스템</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (v9 Compact Mode) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        .full-park { background-color: #fee2e2; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 로그인 화면 -->
    <div id="login-card" class="bg-white p-6 rounded-xl shadow-md w-full max-w-md">
        <h1 class="text-xl font-bold mb-4 text-center">주차 시스템 로그인</h1>
        <div class="space-y-3">
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">이름</label>
                <input type="text" id="user-name" placeholder="이름을 입력하세요" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">팀명 선택</label>
                <select id="user-team" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                    <option value="">팀을 선택하세요</option>
                    <option value="SUP">SUP</option>
                    <option value="3D">3D</option>
                    <option value="2D">2D</option>
                    <option value="MP">MP</option>
                    <option value="PM">PM</option>
                    <option value="ETC">ETC</option>
                </select>
            </div>
            <button onclick="login()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition-colors">접속하기</button>
        </div>
    </div>

    <!-- 주차 예약 메인 화면 -->
    <div id="app-card" class="bg-white p-6 rounded-xl shadow-md w-full max-w-md hidden">
        <div class="flex justify-between items-center mb-4">
            <div>
                <span id="display-user" class="font-bold text-lg"></span>
                <span id="display-team" class="text-sm text-gray-500 ml-1"></span>
            </div>
            <button onclick="logout()" class="text-xs text-gray-400 underline hover:text-gray-600">로그아웃</button>
        </div>

        <!-- 달력 날짜 선택 -->
        <div class="mb-4">
            <label class="block text-xs font-semibold text-gray-500 mb-1">예약 날짜 선택</label>
            <input type="date" id="target-date" onchange="onDateChange()" class="w-full p-2 border rounded-lg font-medium text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- 예약 현황 Card -->
        <div id="parking-status-card" class="p-4 rounded-lg border text-center transition-colors mb-4 bg-gray-50">
            <p class="text-sm text-gray-600 mb-1"><span id="selected-date-text">오늘</span>의 주차 상태</p>
            <div id="status-text" class="text-2xl font-bold text-gray-800">로딩 중...</div>
        </div>

        <!-- 예약 버튼 -->
        <div class="space-y-2 mb-6">
            <button id="reserve-btn" 
                    onclick="handleSingleClick()" 
                    class="w-full bg-emerald-600 text-white py-3 rounded-lg font-semibold hover:bg-emerald-700 active:scale-95 transition-transform">
                주차 예약 / 취소
            </button>
        </div>

        <!-- 해당 날짜 명단 목록 -->
        <div>
            <h3 class="text-sm font-bold text-gray-700 mb-2">예약자 명단</h3>
            <ul id="reservation-list" class="divide-y border rounded-lg overflow-hidden text-sm max-h-48 overflow-y-auto">
                <li class="p-3 text-center text-gray-400">예약 내역이 없습니다.</li>
            </ul>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAxSvaqEi9FwI83hUtJ4TlFmcWPTDD67g0",
            authDomain: "rascaparking.firebaseapp.com",
            databaseURL: "https://rascaparking-default-rtdb.firebaseio.com",
            projectId: "rascaparking",
            storageBucket: "rascaparking.firebasestorage.app",
            messagingSenderId: "11042989524",
            appId: "1:11042989524:web:60038de6d440812ec42241"
        };

        let database = null;
        let currentUser = null;
        let selectedDate = "";
        let parkingListener = null;

        try {
            firebase.initializeApp(firebaseConfig);
            database = firebase.database();
        } catch (e) {
            console.error("Firebase 초기화 오류:", e);
        }

        // 오늘 날짜를 YYYY-MM-DD 형식으로 구하기
        function getTodayString() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function login() {
            const name = document.getElementById('user-name').value.trim();
            const team = document.getElementById('user-team').value;

            if (!name) return alert('이름을 입력해 주세요.');
            if (!team) return alert('팀명을 선택해 주세요.');

            currentUser = { name, team };
            localStorage.setItem('park_user', JSON.stringify(currentUser));
            showApp();
        }

        function logout() {
            localStorage.removeItem('park_user');
            currentUser = null;
            document.getElementById('login-card').classList.remove('hidden');
            document.getElementById('app-card').classList.add('hidden');
        }

        function showApp() {
            document.getElementById('login-card').classList.add('hidden');
            document.getElementById('app-card').classList.remove('hidden');
            document.getElementById('display-user').innerText = currentUser.name;
            document.getElementById('display-team').innerText = `[${currentUser.team}]`;
            
            // 기본 선택 날짜를 오늘로 설정
            if (!selectedDate) {
                selectedDate = getTodayString();
            }
            document.getElementById('target-date').value = selectedDate;
            
            listenToParkingStatus();
        }

        function onDateChange() {
            selectedDate = document.getElementById('target-date').value;
            listenToParkingStatus();
        }

        function listenToParkingStatus() {
            const statusCard = document.getElementById('parking-status-card');
            const statusText = document.getElementById('status-text');
            const dateText = document.getElementById('selected-date-text');
            const listEl = document.getElementById('reservation-list');

            dateText.innerText = selectedDate;

            if (!database) {
                statusText.innerText = "연결 오류";
                return;
            }

            // 기존 리스너 해제 후 선택된 날짜 리스너 등록
            if (parkingListener) {
                parkingListener.off();
            }

            parkingListener = database.ref('parking/' + selectedDate);

            parkingListener.on('value', (snapshot) => {
                const data = snapshot.val() || {};
                const keys = Object.keys(data);
                const count = keys.length;
                const maxCapacity = 10;

                if (count >= maxCapacity) {
                    statusCard.classList.add('full-park');
                    statusText.innerText = `만차 (${count}/${maxCapacity})`;
                } else {
                    statusCard.classList.remove('full-park');
                    statusText.innerText = `여유 (${count}/${maxCapacity})`;
                }

                // 명단 리스트 업데이트
                listEl.innerHTML = '';
                if (count === 0) {
                    listEl.innerHTML = '<li class="p-3 text-center text-gray-400">예약 내역이 없습니다.</li>';
                } else {
                    keys.forEach((key) => {
                        const item = data[key];
                        const li = document.createElement('li');
                        li.className = 'p-3 flex justify-between items-center bg-white border-b last:border-b-0';
                        li.innerHTML = `
                            <span class="font-medium text-gray-800">${item.name}</span>
                            <span class="text-xs bg-gray-200 px-2 py-1 rounded font-semibold text-gray-600">${item.team}</span>
                        `;
                        listEl.appendChild(li);
                    });
                }
            }, (error) => {
                console.error("데이터 읽기 오류:", error);
                statusText.innerText = "DB 연결 확인 필요";
            });
        }

        function handleSingleClick() {
            if (!database) return alert("데이터베이스 연결에 실패했습니다.");
            if (!selectedDate) return alert("날짜를 선택해 주세요.");

            const userKey = `${currentUser.team}_${currentUser.name}`;
            const userRef = database.ref(`parking/${selectedDate}/${userKey}`);

            userRef.once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    userRef.remove();
                    alert(`${selectedDate} 예약이 취소되었습니다.`);
                } else {
                    userRef.set({
                        name: currentUser.name,
                        team: currentUser.team,
                        timestamp: Date.now()
                    });
                    alert(`${selectedDate} 주차 예약이 완료되었습니다.`);
                }
            });
        }

        window.onload = () => {
            selectedDate = getTodayString();
            const saved = localStorage.getItem('park_user');
            if (saved) {
                currentUser = JSON.parse(saved);
                showApp();
            }
        };
    </script>
</body>
</html>
