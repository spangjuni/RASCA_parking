<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사내 주차 예약 시스템</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- external modal script에 defer 속성을 추가하여 DOM 로드 전 실행 오류 방지 -->
  <script src="share-modal.js" defer></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <div id="app"></div>

  <!-- Firebase SDK Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { 
      getAuth, signInAnonymously, signInWithCustomToken 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Firebase 설정 (실제 프로젝트 설정값 유지)
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? __firebase_config 
      : {
          apiKey: "YOUR_API_KEY",
          authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
          projectId: "YOUR_PROJECT_ID",
          storageBucket: "YOUR_PROJECT_ID.appspot.com",
          messagingSenderId: "YOUR_SENDER_ID",
          appId: "YOUR_APP_ID"
        };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const appId = "rasca-parking-v1";

    const COLOR_PRESETS = [
      "#ef4444", "#f97316", "#f59e0b", "#10b981", 
      "#06b6d4", "#3b82f6", "#6366f1", "#8b5cf6", "#ec4899"
    ];

    // 애플리케이션 상태
    const state = {
      currentUser: null,
      reservations: [],
      userProfiles: {},
      selectedDate: new Date().toISOString().split('T')[0],
      isLoading: true,
      loginError: ""
    };

    // 앱 초기화 및 Auth 방어 로직
    async function initAuthAndData() {
      // 로컬스토리지 복원
      const savedUserStr = localStorage.getItem("parking_app_saved_user");
      if (savedUserStr) {
        try {
          state.currentUser = JSON.parse(savedUserStr);
        } catch (e) {
          console.warn("자동 로그인 로드 실패:", e);
        }
      }

      // Auth 에러가 나더라도 UI가 멈추지 않도록 try-catch 처리
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (err) {
        console.warn("Firebase Auth 경고 (익명 로그인 미활성화 상태일 수 있음):", err);
      }

      setupFirestoreListeners();
    }

    function setupFirestoreListeners() {
      // 1. 주차 예약 목록 수신
      const resCollection = collection(db, 'artifacts', appId, 'public', 'data', 'reservations');
      onSnapshot(resCollection, (snapshot) => {
        const list = [];
        snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
        state.reservations = list;
        state.isLoading = false;
        render();
      }, (error) => {
        console.error("Firestore 수신 오류:", error);
        state.isLoading = false;
        render();
      });

      // 2. 프로필 목록 수신
      const profileCollection = collection(db, 'artifacts', appId, 'public', 'data', 'user_profiles');
      onSnapshot(profileCollection, (snapshot) => {
        const profiles = {};
        snapshot.forEach(doc => { profiles[doc.id] = doc.data(); });
        state.userProfiles = profiles;

        if (state.currentUser && profiles[state.currentUser.id]) {
          state.currentUser.carColor = profiles[state.currentUser.id].carColor || state.currentUser.carColor;
        }
        render();
      }, (err) => console.warn("프로필 수신 실패:", err));
    }

    // 로그인 / 접속 처리
    window.handleUserLogin = async function(e) {
      e.preventDefault();
      const nameInput = document.getElementById("username-input");
      const teamInput = document.getElementById("team-select");
      
      const name = nameInput ? nameInput.value.trim() : "";
      const team = teamInput ? teamInput.value : "DEV";

      if (!name) {
        state.loginError = "이름을 입력해 주세요.";
        render();
        return;
      }

      const userKey = `user_${name.replace(/\s+/g, '')}_${team}`;
      const defaultColor = COLOR_PRESETS[Math.floor(Math.random() * COLOR_PRESETS.length)];
      const existingProfile = state.userProfiles[userKey];
      const carColor = existingProfile?.carColor || defaultColor;

      const userObj = {
        id: userKey,
        name: name,
        team: team,
        carColor: carColor,
        isAdmin: team === "SUP" || name.includes("관리자")
      };

      try {
        const userDoc = doc(db, 'artifacts', appId, 'public', 'data', 'user_profiles', userKey);
        await setDoc(userDoc, {
          name: name,
          team: team,
          carColor: carColor,
          updatedAt: Date.now()
        }, { merge: true });

        localStorage.setItem("parking_app_saved_user", JSON.stringify(userObj));
        state.currentUser = userObj;
        state.loginError = "";
        render();
      } catch (err) {
        console.error("로그인 DB 처리 중 에러:", err);
        state.loginError = "DB 접근 권한 오류입니다. Firebase Rules를 확인해 주세요.";
        render();
      }
    };

    // 로그아웃
    window.handleLogout = function() {
      localStorage.removeItem("parking_app_saved_user");
      state.currentUser = null;
      render();
    };

    // UI 렌더링 함수
    function render() {
      const appEl = document.getElementById("app");
      if (!appEl) return;

      if (state.isLoading) {
        appEl.innerHTML = `
          <div class="flex items-center justify-center min-h-screen">
            <div class="text-center">
              <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
              <p class="text-slate-600 font-medium">시스템 불러오는 중...</p>
            </div>
          </div>
        `;
        return;
      }

      // 1. 미접속 상태 -> 로그인 화면
      if (!state.currentUser) {
        appEl.innerHTML = `
          <div class="flex items-center justify-center min-h-screen px-4">
            <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
              <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-slate-800">주차 예약 시스템</h1>
                <p class="text-sm text-slate-500 mt-2">부서와 이름을 입력하여 접속하세요.</p>
              </div>

              <form onsubmit="handleUserLogin(event)" class="space-y-4">
                <div>
                  <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">소속 부서</label>
                  <select id="team-select" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="DEV">개발팀</option>
                    <option value="DESIGN">디자인팀</option>
                    <option value="MARKETING">마케팅팀</option>
                    <option value="SUP">지원팀 (관리자)</option>
                  </select>
                </div>

                <div>
                  <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">이름</label>
                  <input type="text" id="username-input" placeholder="홍길동" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500" required />
                </div>

                ${state.loginError ? `<p class="text-xs text-red-500 font-medium">${state.loginError}</p>` : ''}

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-500/30 transition duration-200">
                  접속하기
                </button>
              </form>
            </div>
          </div>
        `;
        return;
      }

      // 2. 접속 완료 상태 -> 달력 및 주차 현황 화면
      appEl.innerHTML = `
        <div class="max-w-4xl mx-auto px-4 py-6">
          <header class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm mb-6 border border-slate-200">
            <div>
              <span class="text-xs font-semibold px-2.5 py-1 bg-blue-50 text-blue-600 rounded-lg">${state.currentUser.team}</span>
              <h2 class="text-lg font-bold text-slate-800 inline-block ml-2">${state.currentUser.name} 님</h2>
            </div>
            <button onclick="handleLogout()" class="text-xs text-slate-400 hover:text-slate-600 underline">로그아웃</button>
          </header>

          <main class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 class="text-xl font-bold text-slate-800 mb-4">주차 예약 현황</h3>
            <p class="text-sm text-slate-600">정상적으로 화면 전환이 완료되었습니다.</p>
          </main>
        </div>
      `;
    }

    // 초기 실행
    initAuthAndData();
  </script>
</body>
</html>
