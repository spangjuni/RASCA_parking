<!DOCTYPE html>
<html lang="ko" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사내 주차 예약 시스템</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">

        tailwind.config = {

<body class="h-full overflow-hidden flex flex-col bg-slate-950 text-slate-100 relative">

    <!-- 초기 로딩 스크린 (자동 로그인 확인용) -->

        <p class="text-white font-medium text-sm">시스템에 연결 중입니다...</p>
    </div>

    <!-- 로그인 모달 (첫 화면) -->
    <div id="loginModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 hidden items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-8 shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white text-2xl shadow-lg shadow-blue-500/30 mx-auto">
                    <i class="fa-solid fa-car"></i>
                </div>
                <h1 class="text-xl font-bold text-white">주차 예약 시스템</h1>
                <p class="text-xs text-slate-400">사내 주차 예약 시스템 이용을 위해 정보를 입력해주세요.</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">이름</label>
                    <input type="text" id="loginName" required placeholder="예: 홍길동" 
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">소속 부서</label>
                    <select id="loginDept" required 
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition">
                        <option value="" disabled selected>부서를 선택하세요</option>
                        <option value="CEO">CEO</option>
                        <option value="SUP">SUP</option>
                        <option value="2D">2D</option>
                        <option value="3D">3D</option>
                        <option value="MP">MP</option>
                        <option value="PM">PM</option>
                        <option value="ETC">ETC</option>
                    </select>
                </div>

                <button type="submit" id="loginSubmitBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-600/30 transition text-sm flex justify-center items-center gap-2">
                    <span>입장하기</span>

        </div>
    </div>

    <div id="mainApp" class="flex-1 flex flex-col md:flex-row h-full overflow-hidden hidden">
        <aside class="w-full md:w-64 bg-slate-900 md:border-r border-slate-800 flex flex-col shrink-0 z-20">
            
            <!-- 사용자 정보 및 프로필 영역 -->
            <div class="order-1 md:order-2 p-4 border-b md:border-b-0 md:border-t border-slate-800 bg-slate-900/50 space-y-3 md:mt-auto">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3 min-w-0">
                        <div id="userColorIndicator" class="w-9 h-9 rounded-full flex items-center justify-center text-white font-bold text-xs shrink-0 shadow-md cursor-pointer relative group" title="클릭하여 색상 변경" onclick="togglePalettePopup()">
                            -
                        </div>
                        <div class="flex-1 min-w-0 cursor-pointer" onclick="togglePalettePopup()" title="클릭하여 색상 변경">

                            <p class="text-[10px] text-slate-400 truncate flex items-center gap-1">
                                <span>내 색상 변경</span>

                        </div>

                    <button onclick="logout()" title="로그아웃 (다른 계정 접속)" class="text-slate-400 hover:text-rose-400 p-2 transition">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>

            <!-- 네비게이션 메뉴 -->
            <div class="order-2 md:order-1">
                <nav class="p-3 md:p-4 flex gap-2 md:flex-col md:space-y-1.5 overflow-x-auto border-b md:border-b-0 border-slate-800">
                    <a href="#" onclick="switchTab('calendar')" class="nav-item-calendar flex-1 md:flex-none flex items-center justify-center md:justify-start gap-2 px-4 py-2.5 md:py-3 rounded-xl text-sm font-medium transition-all bg-blue-600 text-white shadow-lg shadow-blue-600/20 whitespace-nowrap">
                        <i class="fa-solid fa-calendar-alt w-5 text-center"></i>
                        주차 예약
                    </a>
                    <a href="#" onclick="switchTab('status')" class="nav-item-status flex-1 md:flex-none flex items-center justify-center md:justify-start gap-2 px-4 py-2.5 md:py-3 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition-all whitespace-nowrap">
                        <i class="fa-solid fa-car w-5 text-center"></i>
                        내 예약 현황
                    </a>
                </nav>
            </div>
        </aside>

        <!-- 메인 콘텐츠 영역 -->
        <main class="flex-1 overflow-y-auto flex flex-col h-full bg-slate-950 relative">
            
            <!-- Tab 1: Calendar View -->
            <div id="tab-calendar" class="tab-content p-4 sm:p-6 space-y-4 sm:space-y-6 mt-2 md:mt-0">
                <!-- 달력 컨트롤러 및 안내 -->
                <div class="flex flex-col sm:flex-row items-center justify-between gap-4 p-4 rounded-2xl bg-slate-900 border border-slate-800">
                    <div class="flex items-center gap-4">
                        <button onclick="changeMonth(-1)" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center border border-slate-700 transition">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <h3 id="calendarMonthTitle" class="text-lg font-bold text-white tracking-wide">2026년 8월</h3>
                        <button onclick="changeMonth(1)" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center border border-slate-700 transition">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>

                    <div class="flex items-center gap-4 text-xs font-medium">
                        <div class="flex items-center gap-1.5 text-slate-400 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700/50 whitespace-nowrap overflow-hidden text-ellipsis w-full justify-center">
                            <i class="fa-solid fa-circle-info text-blue-400"></i>
                            클릭: 예약/취소 | 꾹 누르기: 다중 예약/예약현황
                        </div>
                    </div>
                </div>

                <div class="p-4 sm:p-6 rounded-2xl bg-slate-900 border border-slate-800 shadow-xl">
                    <!-- 요일 헤더 -->
                    <div class="grid grid-cols-7 gap-1 sm:gap-2 text-center text-xs font-bold text-slate-400 mb-3">
                        <span class="text-rose-400">일</span>
                        <span>월</span>
                        <span>화</span>
                        <span>수</span>
                        <span>목</span>
                        <span>금</span>
                        <span class="text-rose-400">토</span>
                    </div>

                    <div id="calendarGrid" class="grid grid-cols-7 gap-1 sm:gap-2">
                        <!-- Dynamic Days -->
                    </div>
                </div>
            </div>

            <!-- Tab 2: My Status View -->
            <div id="tab-status" class="tab-content p-4 sm:p-6 space-y-6 mt-2 md:mt-0 hidden">
                <div class="max-w-4xl space-y-6">
                    <div class="p-6 rounded-2xl bg-slate-900 border border-slate-800 space-y-4">
                        <h4 class="text-sm font-bold text-white mb-2">내가 예약한 주차 일자 목록</h4>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-slate-800/80 text-slate-400 uppercase font-medium">
                                    <tr>
                                        <th class="p-3 rounded-l-lg">날짜</th>
                                        <th class="p-3">예약자</th>
                                        <th class="p-3">부서</th>
                                        <th class="p-3 rounded-r-lg text-right">관리</th>
                                    </tr>
                                </thead>
                                <tbody id="myReservationsTable" class="divide-y divide-slate-800 text-slate-300">
                                    <!-- Dynamic Rows -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 색상 선택 모달 -->
    <div id="colorPaletteModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-sm p-6 shadow-2xl space-y-5">
            <div class="flex items-center justify-between">
                <div>
                    <h3 class="text-base font-bold text-white">나의 예약 색상 선택</h3>
                    <!-- 25가지 컬러 텍스트 수정 -->
                    <p class="text-xs text-slate-400">캘린더에 표시될 25가지 컬러 중 선택하세요.</p>
                </div>
                <button onclick="closeColorPaletteModal()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div id="paletteGrid" class="grid grid-cols-5 gap-3 py-2"></div>
            <button onclick="closeColorPaletteModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-2.5 rounded-xl text-xs transition">
                확인
            </button>
        </div>
    </div>

    <!-- 상세 보기(다중 예약) 모달 -->
    <div id="dayDetailModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
            <button onclick="closeDayModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white p-2">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div class="flex items-center gap-3 mb-4">
                <div class="w-12 h-12 rounded-xl bg-blue-600/20 text-blue-400 border border-blue-500/30 font-bold text-lg flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-car"></i>
                </div>
                <div>
                    <h3 id="modalDateTitle" class="text-base font-bold text-white">2026년 8월 20일</h3>
                    <!-- 최대 6대 텍스트 수정 -->
                    <p id="modalDateSubtitle" class="text-xs text-slate-400">최대 6대 중 2대 예약 완료</p>
                </div>
            </div>

            <div class="space-y-2 border-t border-b border-slate-800 py-4 my-4 text-xs min-h-[100px]" id="modalReservationList">
                <!-- 예약자 리스트 -->
            </div>

            <div class="flex gap-2 justify-end">
                <button onclick="closeDayModal()" class="px-4 py-3 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 font-medium text-xs">닫기</button>
                <button onclick="addCarFromModal()" id="modalActionBtn" class="flex-1 px-4 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs shadow transition">차량 추가 예약하기</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-800 text-white text-xs font-semibold px-4 py-3 rounded-xl border border-slate-700 shadow-2xl opacity-0 pointer-events-none transition-all duration-300 z-[100] flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
        <span id="toastMsg">처리되었습니다.</span>
    </div>

    <!-- Firebase SDK & Module Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, deleteDoc, updateDoc, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAxSvaqEi9FwI83hUtJ4TlFmcWPTDD67g0",
            authDomain: "rascaparking.firebaseapp.com",
            projectId: "rascaparking",
            storageBucket: "rascaparking.firebasestorage.app",
            messagingSenderId: "11042989524",
            appId: "1:11042989524:web:60038de6d440812ec42241",
            measurementId: "G-M3E6TL4Q9E"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseDb = db;
        window.firebaseAuth = auth;
        window.signInAnonymously = signInAnonymously;
        window.signOut = signOut;
        window.doc = doc;
        window.getDoc = getDoc;
        window.setDoc = setDoc;
        window.deleteDoc = deleteDoc;
        window.updateDoc = updateDoc;
        window.collection = collection;
        window.addDoc = addDoc;
        window.onSnapshot = onSnapshot;

        window.initFirebaseApp = function() {
            onAuthStateChanged(auth, async (user) => {
                const loader = document.getElementById('loadingScreen');
                
                if (user) {
                    try {
                        const profileRef = window.doc(window.firebaseDb, 'users', user.uid);
                        const profileSnap = await window.getDoc(profileRef);
                        
                        if (profileSnap.exists()) {
                            window.currentUser = profileSnap.data();
                            window.updateUserUI();
                            window.showMainApp();
                            window.startReservationsListener();
                        } else {
                            window.showLoginModal();
                        }
                    } catch(e) {
                        console.error("Profile Fetch Error:", e);
                        window.showLoginModal();
                    }
                } else {
                    window.showLoginModal();
                }

                // 로딩 화면 숨김
                loader.classList.add('opacity-0');
                setTimeout(() => loader.classList.add('hidden'), 300);
            });
        };

        window.onload = () => {
            window.initFirebaseApp();
            window.renderColorPalettePicker();
            window.renderCalendar();
        };
    </script>

    <!-- UI & Application Logic Script -->
    <script>
        let currentDate = new Date(); 
        let currentUser = null; 

        // 텔레그램 봇 설정 (실제 사용 시 발급받은 토큰과 ID로 변경해주세요)
        const TELEGRAM_BOT_TOKEN = '8702536939:AAHudFY0o0jcLCpu_5toUeQuWdr7kCJ69Rg';
        const TELEGRAM_CHAT_ID = '5478752885';

        // 주요 공휴일 데이터
        const holidays = {
            "2026-01-01": "신정", "2026-02-16": "설날 연휴", "2026-02-17": "설날", "2026-02-18": "설날 연휴",
            "2026-03-01": "삼일절", "2026-05-05": "어린이날", "2026-05-24": "부처님오신날", "2026-06-06": "현충일",
            "2026-08-15": "광복절", "2026-09-24": "추석 연휴", "2026-09-25": "추석", "2026-09-26": "추석 연휴",
            "2026-10-03": "개천절", "2026-10-09": "한글날", "2026-12-25": "성탄절"
        };

        // 색상 25개로 확장 (검정, 흰색, 회색 포함, 총 25개)
        const colorPalette = [
            "#3b82f6", "#60a5fa", "#1d4ed8", "#2563eb",
            "#ec4899", "#f472b6", "#be185d", "#db2777",
            "#10b981", "#34d399", "#059669", "#047857",
            "#f59e0b", "#fbbf24", "#d97706", "#b45309",
            "#8b5cf6", "#a78bfa", "#7c3aed", "#06b6d4",
            "#000000", "#ffffff", "#9ca3af", "#ef4444", "#84cc16" // 추가된 색상 (검,흰,회,빨강,연두)
        ];

        let reservations = {}; 
        let selectedDateStrForModal = null;

        function showLoginModal() {
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('loginModal').classList.remove('hidden');
            document.getElementById('loginModal').classList.add('flex');
        }

        function showMainApp() {
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('loginModal').classList.remove('flex');
            document.getElementById('mainApp').classList.remove('hidden');
        }

        async function handleLogin(event) {
            event.preventDefault();
            const name = document.getElementById('loginName').value.trim();
            const dept = document.getElementById('loginDept').value;
            if (!name || !dept) return;

            const btn = document.getElementById('loginSubmitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 접속 중...';

            window.currentUser = { name, dept, color: colorPalette[0] };

            try {
                const userCred = await window.signInAnonymously(window.firebaseAuth);
                const user = userCred.user;
                
                const profileRef = window.doc(window.firebaseDb, 'users', user.uid);
                await window.setDoc(profileRef, window.currentUser);

                window.updateUserUI();
                showMainApp();
                window.startReservationsListener();
                showToast(`환영합니다, ${window.currentUser.name}님!`);
            } catch (e) {
                console.error(e);
                showToast("로그인 처리 중 오류가 발생했습니다.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '입장하기';
            }
        }

        async function logout() {
            if(window.firebaseAuth) {
                await window.signOut(window.firebaseAuth);
            }
            window.location.reload();
        }

        function updateUserUI() {
            if(!window.currentUser) return;
            document.getElementById('currentUserNameDisplay').textContent = `${window.currentUser.name} (${window.currentUser.dept})`;
            const indicator = document.getElementById('userColorIndicator');
            indicator.textContent = window.currentUser.name.charAt(0);
            indicator.style.backgroundColor = window.currentUser.color;
            
            // 텍스트가 흰색일 경우 배경이 흰색이면 안 보이므로 처리
            if (window.currentUser.color === "#ffffff") {
                indicator.style.color = "#000000";
            } else {
                indicator.style.color = "#ffffff";
            }

            document.getElementById('currentColorCodeText').style.backgroundColor = window.currentUser.color;
            window.renderColorPalettePicker();
        }

        window.startReservationsListener = function() {
            const q = window.collection(window.firebaseDb, 'reservations');
            window.onSnapshot(q, (snapshot) => {
                reservations = {};
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (!reservations[data.date]) reservations[data.date] = [];
                    reservations[data.date].push({ id: doc.id, ...data });
                });

                Object.keys(reservations).forEach(date => {
                    reservations[date].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                });

                window.renderCalendar();
                window.renderMyReservations();
                
                if (selectedDateStrForModal && !document.getElementById('dayDetailModal').classList.contains('hidden')) {
                    openDayDetailModal(selectedDateStrForModal);
                }
            });
        }

        function togglePalettePopup() { document.getElementById('colorPaletteModal').classList.remove('hidden'); }
        function closeColorPaletteModal() { document.getElementById('colorPaletteModal').classList.add('hidden'); }

        window.renderColorPalettePicker = function() {
            if(!window.currentUser) return;
            const container = document.getElementById('paletteGrid');
            container.innerHTML = '';
            colorPalette.forEach(hex => {
                const btn = document.createElement('button');
                const isSelected = window.currentUser.color === hex;
                btn.className = `w-12 h-12 rounded-2xl transition transform hover:scale-110 mx-auto ${isSelected ? 'ring-4 ring-blue-400 ring-offset-2 ring-offset-slate-900 scale-110 shadow-lg' : 'opacity-80 hover:opacity-100 border border-slate-700'}`;
                btn.style.backgroundColor = hex;
                btn.onclick = () => updateMyColor(hex);
                container.appendChild(btn);
            });
        }

        async function updateMyColor(newColor) {
            if(!window.firebaseAuth.currentUser || !window.currentUser) return;
            window.currentUser.color = newColor;
            window.updateUserUI();
            showToast("색상 변경중...");

            try {
                const profileRef = window.doc(window.firebaseDb, 'users', window.firebaseAuth.currentUser.uid);
                await window.setDoc(profileRef, window.currentUser);

                const updates = [];
                Object.values(reservations).forEach(dayList => {
                    dayList.forEach(res => {
                        if (res.name === window.currentUser.name && res.dept === window.currentUser.dept) {
                            const resRef = window.doc(window.firebaseDb, 'reservations', res.id);
                            updates.push(window.updateDoc(resRef, { 
                                color: newColor,
                                userId: window.firebaseAuth.currentUser.uid
                            }));
                        }
                    });
                });
                await Promise.all(updates);
                showToast('색상이 변경되었습니다.');
            } catch(e) {
                console.error(e);
            }
        }

        // 안정적인 탭 전환 로직
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');

            // 모든 네비게이션 아이템 스타일 초기화 (기본 상태)
            document.querySelectorAll('aside nav a').forEach(a => {
                a.classList.remove('bg-blue-600', 'text-white', 'shadow-lg', 'shadow-blue-600/20');
                a.classList.add('text-slate-400', 'hover:bg-slate-800', 'hover:text-slate-200');
            });
            
            // 선택된 탭 활성화 스타일 적용
            const activeTab = document.querySelector(`.nav-item-${tabId}`);
            if (activeTab) {
                activeTab.classList.remove('text-slate-400', 'hover:bg-slate-800', 'hover:text-slate-200');
                activeTab.classList.add('bg-blue-600', 'text-white', 'shadow-lg', 'shadow-blue-600/20');
            }
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            window.renderCalendar();
        }

        window.renderCalendar = function() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('calendarMonthTitle').textContent = `${year}년 ${month + 1}월`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = "h-20 sm:h-28 md:h-32 bg-slate-950/30 rounded-xl border border-slate-900 opacity-30";
                grid.appendChild(emptyDiv);
            }

            for (let day = 1; day <= lastDay; day++) {
                const monthStr = String(month + 1).padStart(2, '0');
                const dayStr = String(day).padStart(2, '0');
                const dateKey = `${year}-${monthStr}-${dayStr}`;

                const holidayName = holidays[dateKey];
                const dayOfWeek = new Date(year, month, day).getDay();
                const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
                
                const dayReservations = reservations[dateKey] || [];
                const count = dayReservations.length;
                const isMyReserved = window.currentUser && dayReservations.some(r => r.name === window.currentUser.name && r.dept === window.currentUser.dept);

                const cell = document.createElement('div');
                
                let bgClass = "bg-slate-800/60 border-slate-700/80 hover:border-slate-500";
                // 6대 기준으로 배경색 알림 조건 수정
                if (count >= 6) bgClass = "bg-rose-950/30 border-rose-900/60 hover:border-rose-600";
                else if (count === 5) bgClass = "bg-amber-950/30 border-amber-900/60 hover:border-amber-600";
                if (isMyReserved) bgClass += " ring-2 ring-blue-500 bg-blue-950/20";

                cell.className = `h-20 sm:h-28 md:h-32 rounded-xl border p-1.5 sm:p-2.5 flex flex-col justify-between cursor-pointer transition-all select-none relative ${bgClass}`;

                // 2x3 배열을 위해 grid-cols-2 로 수정 (모바일 최적화)
                let dotsHtml = '<div class="grid grid-cols-2 gap-1 sm:gap-1.5 w-7 sm:w-9 mx-auto my-auto">';
                for (let i = 0; i < 6; i++) {
                    if (i < count) {
                        dotsHtml += `<div class="w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full shadow-sm mx-auto" style="background-color: ${dayReservations[i].color}; border: 1px solid rgba(255,255,255,0.1);"></div>`;
                    } else {
                        dotsHtml += `<div class="w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full bg-slate-800/80 border border-slate-700 mx-auto"></div>`;
                    }
                }
                dotsHtml += '</div>';

                let holidayHtml = holidayName ? `<span class="text-[8px] sm:text-[10px] bg-rose-500/20 text-rose-300 px-1 sm:px-1.5 py-0.5 rounded font-medium truncate max-w-[50px] sm:max-w-[70px] hidden sm:block">${holidayName}</span>` : '';

                let dateColor = 'text-slate-200';
                if (holidayName || isWeekend) dateColor = 'text-rose-400';

                cell.innerHTML = `
                    <div class="flex items-start sm:items-center justify-between">
                        <span class="font-bold text-xs sm:text-sm ${dateColor}">${day}</span>
                        <div class="flex flex-col sm:flex-row items-end sm:items-center gap-1">
                            ${holidayHtml}
                            ${isMyReserved ? '<span class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-blue-500 animate-pulse"></span>' : ''}
                        </div>
                    </div>
                    ${dotsHtml}
                    <div class="h-1 sm:h-3"></div>
                `;

                let pressTimer;
                const startPress = () => { pressTimer = setTimeout(() => { openDayDetailModal(dateKey); }, 500); };
                const cancelPress = () => { clearTimeout(pressTimer); };

                cell.addEventListener('mousedown', startPress);
                cell.addEventListener('touchstart', startPress, {passive: true});
                cell.addEventListener('mouseup', cancelPress);
                cell.addEventListener('mouseleave', cancelPress);
                cell.addEventListener('touchend', cancelPress);

                cell.onclick = (e) => {
                    if (pressTimer) clearTimeout(pressTimer);
                    handleCellClick(dateKey);
                };
                grid.appendChild(cell);
            }
        }

        // 텔레그램 메시지 전송 함수 추가
        async function sendTelegramMessage(dateKey) {
            if (!TELEGRAM_BOT_TOKEN || !TELEGRAM_CHAT_ID || TELEGRAM_BOT_TOKEN.includes('여기에')) return;
            
            const message = `📢 [주차 알림]\n${dateKey} 일자의 대표님 주차 자리가 비었습니다. 주차 가능합니다!`;
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            
            try {
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message
                    })
                });
            } catch (e) {
                console.error("텔레그램 알림 전송 실패:", e);
            }
        }

        async function handleCellClick(dateKey) {
            if (!window.currentUser || !window.firebaseAuth.currentUser) return;
            const dayList = reservations[dateKey] || [];
            
            let myLastRes = null;
            for(let i = dayList.length -1; i >= 0; i--) {
                if(dayList[i].name === window.currentUser.name && dayList[i].dept === window.currentUser.dept) {
                    myLastRes = dayList[i];
                    break;
                }
            }

            try {
                if (myLastRes) {
                    // 알림 조건: 부서가 CEO이거나 색상이 흰색(#ffffff)일 때
                    const isCEO = myLastRes.dept === 'CEO' || myLastRes.color === '#ffffff';
                    await window.deleteDoc(window.doc(window.firebaseDb, 'reservations', myLastRes.id));
                    showToast(`${dateKey} 1대 예약을 취소했습니다.`);
                    
                    // 대표님이 취소한 경우 텔레그램 알림 전송
                    if (isCEO) {
                        sendTelegramMessage(dateKey);
                    }
                } else {
                    // 제한을 6대로 수정
                    if (dayList.length >= 6) {
                        showToast(`⚠️ 만차(6대)되어 예약할 수 없습니다.`);
                        return;
                    }
                    await window.addDoc(window.collection(window.firebaseDb, 'reservations'), {
                        date: dateKey,
                        name: window.currentUser.name,
                        dept: window.currentUser.dept,
                        color: window.currentUser.color,
                        userId: window.firebaseAuth.currentUser.uid,
                        createdAt: Date.now()
                    });
                    showToast(`✨ ${dateKey} 주차가 예약되었습니다!`);
                }
            } catch (e) {
                console.error(e);
            }
        }

        function openDayDetailModal(dateKey) {
            selectedDateStrForModal = dateKey;
            const dayList = reservations[dateKey] || [];
            const holidayName = holidays[dateKey];
            const dayOfWeek = new Date(dateKey).getDay();
            const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

            let titleColor = (holidayName || isWeekend) ? "text-rose-400" : "text-white";
            
            document.getElementById('modalDateTitle').className = `text-base font-bold ${titleColor}`;
            document.getElementById('modalDateTitle').textContent = `${dateKey} ${holidayName ? `(${holidayName})` : ''}`;
            
            // 최대 6대 텍스트로 수정
            document.getElementById('modalDateSubtitle').textContent = `최대 6대 중 ${dayList.length}대 예약 완료`;

            const listContainer = document.getElementById('modalReservationList');
            if (dayList.length === 0) {
                listContainer.innerHTML = `<div class="flex h-full items-center justify-center text-slate-500 py-6">아직 예약된 차량이 없습니다.</div>`;
            } else {
                listContainer.innerHTML = dayList.map((r, idx) => {
                    const isMine = window.currentUser && r.name === window.currentUser.name && r.dept === window.currentUser.dept;
                    const cancelBtnHtml = isMine ? 
                        `<button onclick="cancelSpecificReservation('${r.id}')" class="ml-2 bg-rose-500/20 text-rose-400 hover:bg-rose-500/40 px-2 py-1 rounded text-[10px] transition">X 취소</button>` : '';

                    return `
                    <div class="flex justify-between items-center p-2.5 rounded-lg bg-slate-800/60 mb-2">
                        <div class="flex items-center gap-3">
                            <span class="w-3 h-3 rounded-full shrink-0 shadow-sm border border-slate-700" style="background-color: ${r.color};"></span>
                            <span class="font-medium ${isMine ? 'text-blue-400' : 'text-slate-200'}">${idx + 1}. [${r.dept}] ${r.name}</span>
                        </div>
                        <div class="flex items-center">
                            <span class="text-[10px] text-slate-400">예약완료</span>
                            ${cancelBtnHtml}
                        </div>
                    </div>
                `}).join('');
            }

            const actionBtn = document.getElementById('modalActionBtn');
            // 제한을 6대로 수정
            if (dayList.length >= 6) {
                actionBtn.textContent = "만차 (예약불가)";
                actionBtn.disabled = true;
                actionBtn.className = "flex-1 px-4 py-3 rounded-xl bg-slate-800 text-slate-500 font-bold text-xs cursor-not-allowed";
            } else {
                actionBtn.textContent = "차량 추가 예약하기";
                actionBtn.disabled = false;
                actionBtn.className = "flex-1 px-4 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs shadow transition";
            }

            document.getElementById('dayDetailModal').classList.remove('hidden');
        }

        function closeDayModal() {
            document.getElementById('dayDetailModal').classList.add('hidden');
            selectedDateStrForModal = null;
        }

        async function cancelSpecificReservation(docId) {
            if (!window.firebaseAuth.currentUser) return;
            
            // 삭제할 예약 정보 미리 찾기 (대표님인지 확인하기 위함)
            let resToDelete = null;
            for (let date in reservations) {
                const found = reservations[date].find(r => r.id === docId);
                if (found) {
                    resToDelete = found;
                    break;
                }
            }

            try {
                await window.deleteDoc(window.doc(window.firebaseDb, 'reservations', docId));
                showToast(`선택한 차량 예약을 취소했습니다.`);
                
                // 대표님이 취소한 경우 텔레그램 알림 전송
                if (resToDelete) {
                    // 알림 조건: 부서가 CEO이거나 색상이 흰색(#ffffff)일 때
                    const isCEO = resToDelete.dept === 'CEO' || resToDelete.color === '#ffffff';
                    if (isCEO) {
                        sendTelegramMessage(resToDelete.date);
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function addCarFromModal() {
            if (selectedDateStrForModal && window.currentUser && window.firebaseAuth.currentUser) {
                const dayList = reservations[selectedDateStrForModal] || [];
                // 제한을 6대로 수정
                if (dayList.length < 6) {
                    try {
                        const actionBtn = document.getElementById('modalActionBtn');
                        actionBtn.disabled = true;
                        
                        await window.addDoc(window.collection(window.firebaseDb, 'reservations'), {
                            date: selectedDateStrForModal,
                            name: window.currentUser.name,
                            dept: window.currentUser.dept,
                            color: window.currentUser.color,
                            userId: window.firebaseAuth.currentUser.uid,
                            createdAt: Date.now()
                        });
                        showToast(`차량이 추가 예약되었습니다!`);
                    } catch(e) {
                        console.error(e);
                    }
                }
            }
        }

        window.renderMyReservations = function() {
            const tbody = document.getElementById('myReservationsTable');
            tbody.innerHTML = '';
            if (!window.currentUser || !window.firebaseAuth.currentUser) return;

            let myItems = [];
            Object.keys(reservations).forEach(dateKey => {
                reservations[dateKey].forEach(r => {
                    if (r.name === window.currentUser.name && r.dept === window.currentUser.dept) {
                        myItems.push({ dateKey, id: r.id, createdAt: r.createdAt });
                    }
                });
            });

            myItems.sort((a, b) => {
                if(a.dateKey === b.dateKey) return (a.createdAt || 0) - (b.createdAt || 0);
                return a.dateKey.localeCompare(b.dateKey);
            });

            if (myItems.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-500">예약된 주차 일정이 없습니다.</td></tr>`;
                return;
            }

            myItems.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/50 transition-colors";
                tr.innerHTML = `
                    <td class="p-3 font-mono font-bold text-white">${item.dateKey}</td>
                    <td class="p-3 text-slate-300">${window.currentUser.name}</td>
                    <td class="p-3 text-slate-400">${window.currentUser.dept}</td>
                    <td class="p-3 text-right">
                        <button onclick="cancelSpecificReservation('${item.id}')" class="text-rose-400 hover:text-rose-300 text-xs px-2 py-1 bg-rose-500/10 rounded">취소</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
                toast.classList.remove('opacity-100');
            }, 2500);
        }
    </script>
</body>
</html>
