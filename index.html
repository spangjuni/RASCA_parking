<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사내 주차 예약 시스템</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (v9 Compact Mode) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        .full-park { background-color: #fee2e2; } /* 만차 시 붉은 배경 */
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 로그인 화면 -->
    <div id="login-card" class="bg-white p-6 rounded-xl shadow-md w-full max-w-md">
        <h1 class="text-xl font-bold mb-4 text-center">주차 시스템 로그인</h1>
        <div class="space-y-3">
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">이름</label>
                <input type="text" id="user-name" placeholder="이름을 입력하세요" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">팀명 선택</label>
                <select id="user-team" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                    <option value="">팀을 선택하세요</option>
                    <option value="SUP">SUP</option>
                    <option value="3D">3D</option>
                    <option value="2D">2D</option>
                    <option value="MP">MP</option>
                    <option value="PM">PM</option>
                    <option value="ETC">ETC</option>
                </select>
            </div>
            <button onclick="login()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition-colors">접속하기</button>
        </div>
    </div>

    <!-- 주차 예약 메인 화면 -->
    <div id="app-card" class="bg-white p-6 rounded-xl shadow-md w-full max-w-md hidden">
        <div class="flex justify-between items-center mb-4">
            <div>
                <span id="display-user" class="font-bold text-lg"></span>
                <span id="display-team" class="text-sm text-gray-500 ml-1"></span>
            </div>
            <button onclick="logout()" class="text-xs text-gray-400 underline hover:text-gray-600">로그아웃</button>
        </div>

        <!-- 예약 현황 및 버튼 -->
        <div id="parking-status-card" class="p-4 rounded-lg border text-center transition-colors mb-4 bg-gray-50">
            <p class="text-sm text-gray-600 mb-1">오늘의 주차 상태</p>
            <div id="status-text" class="text-2xl font-bold text-gray-800">로딩 중...</div>
        </div>

        <div class="space-y-2">
            <button id="reserve-btn" 
                    onclick="handleSingleClick()" 
                    oncontextmenu="handleLongPress(event)" 
                    class="w-full bg-emerald-600 text-white py-3 rounded-lg font-semibold hover:bg-emerald-700 active:scale-95 transition-transform">
                주차 예약 / 취소 (클릭)
            </button>
            <p class="text-xs text-center text-gray-400">* 길게 누르거나 우클릭 시 상세 현황 확인</p>
        </div>
    </div>

    <script>
        // Firebase 설정 (실제 본인의 Firebase 콘솔 설정값으로 변경해야 데이터가 저장됩니다)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        let database = null;
        let currentUser = null;

        // Firebase 안전 초기화
        try {
            if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
                firebase.initializeApp(firebaseConfig);
                database = firebase.database();
            }
        } catch (e) {
            console.error("Firebase 초기화 오류:", e);
        }

        // 로그인
        function login() {
            const name = document.getElementById('user-name').value.trim();
            const team = document.getElementById('user-team').value;

            if (!name) {
                alert('이름을 입력해 주세요.');
                return;
            }
            if (!team) {
                alert('팀명을 선택해 주세요.');
                return;
            }

            currentUser = { name, team };
            localStorage.setItem('park_user', JSON.stringify(currentUser));
            showApp();
        }

        // 로그아웃
        function logout() {
            localStorage.removeItem('park_user');
            currentUser = null;
            document.getElementById('login-card').classList.remove('hidden');
            document.getElementById('app-card').classList.add('hidden');
        }

        // 앱 화면 전환
        function showApp() {
            document.getElementById('login-card').classList.add('hidden');
            document.getElementById('app-card').classList.remove('hidden');
            document.getElementById('display-user').innerText = currentUser.name;
            document.getElementById('display-team').innerText = `[${currentUser.team}]`;
            
            listenToParkingStatus();
        }

        // 실시간 상태 수신
        function listenToParkingStatus() {
            const statusCard = document.getElementById('parking-status-card');
            const statusText = document.getElementById('status-text');

            // Firebase가 설정되지 않은 경우 가이드 안내
            if (!database) {
                statusText.innerText = "설정 필요";
                statusText.classList.add("text-amber-600");
                alert("코드 내 firebaseConfig 부분에 실제 Firebase 인증 정보를 입력해야 실시간 연동이 완료됩니다.");
                return;
            }

            const today = new Date().toISOString().split('T')[0];
            const parkingRef = database.ref('parking/' + today);

            parkingRef.on('value', (snapshot) => {
                const data = snapshot.val() || {};
                const count = Object.keys(data).length;
                const maxCapacity = 10; // 최대 주차 가능 대수

                if (count >= maxCapacity) {
                    statusCard.classList.add('full-park');
                    statusText.innerText = `만차 (${count}/${maxCapacity})`;
                } else {
                    statusCard.classList.remove('full-park');
                    statusText.innerText = `여유 (${count}/${maxCapacity})`;
                }
            }, (error) => {
                console.error("데이터 읽기 오류:", error);
                statusText.innerText = "연결 오류";
            });
        }

        // 1대 예약 / 취소
        function handleSingleClick() {
            if (!database) {
                alert("Firebase 설정이 완료되지 않았습니다.");
                return;
            }

            const today = new Date().toISOString().split('T')[0];
            const userKey = `${currentUser.team}_${currentUser.name}`;
            const userRef = database.ref(`parking/${today}/${userKey}`);

            userRef.once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    userRef.remove();
                    alert('예약이 취소되었습니다.');
                } else {
                    userRef.set({
                        name: currentUser.name,
                        team: currentUser.team,
                        timestamp: Date.now()
                    });
                    alert('주차 예약이 완료되었습니다.');
                }
            });
        }

        // 롱프레스 / 우클릭 관리
        function handleLongPress(e) {
            e.preventDefault();
            alert('상세 현황 기능 영역입니다.');
        }

        // 자동 로그인 확인
        window.onload = () => {
            const saved = localStorage.getItem('park_user');
            if (saved) {
                currentUser = JSON.parse(saved);
                showApp();
            }
        };
    </script>
</body>
</html>
